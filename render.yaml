services:
  - type: web
    name: elvarq-ai
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GROQ_MODEL_BETA
        value: llama-3.1-8b-instant
      - key: GROQ_MODEL_MIDDLE
        value: llama-3.3-70b-versatile
      - key: GROQ_MODEL_THINKING
        value: llama-3.3-70b-versatile
